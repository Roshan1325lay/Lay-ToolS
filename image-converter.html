<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter | Multi-Tool</title>
    <style>
        :root {
            --primary: #0cf;
            --secondary: #6a11cb;
            --dark: #0a0e17;
            --darker: #050811;
            --light: #e0f7ff;
            --glow: 0 0 15px var(--primary);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--darker);
            color: var(--light);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(10, 174, 227, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(106, 17, 203, 0.1) 0%, transparent 20%),
                linear-gradient(to bottom, var(--darker), var(--dark));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(10, 174, 227, 0.03) 2px, rgba(10, 174, 227, 0.03) 4px);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: var(--glow);
        }

        .subtitle {
            color: rgba(224, 247, 255, 0.7);
            font-size: 1.1rem;
        }

        .tool-container {
            background: rgba(10, 14, 23, 0.7);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 
                0 0 30px rgba(0, 204, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 204, 255, 0.2);
            margin-bottom: 2rem;
        }

        .upload-area {
            border: 2px dashed rgba(0, 204, 255, 0.4);
            border-radius: 10px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            box-shadow: var(--glow);
            background: rgba(0, 204, 255, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
            text-shadow: var(--glow);
        }

        .upload-text {
            margin-bottom: 1.5rem;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 204, 255, 0.3);
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 204, 255, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .preview-section {
            display: none;
            margin-top: 2rem;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .preview-box {
            flex: 1;
            min-width: 300px;
            background: rgba(5, 8, 17, 0.6);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 204, 255, 0.2);
        }

        .preview-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--primary);
            text-align: center;
        }

        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 5px;
            background: var(--darker);
        }

        .format-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .format-option {
            background: rgba(5, 8, 17, 0.6);
            border: 1px solid rgba(0, 204, 255, 0.2);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .format-option:hover {
            border-color: var(--primary);
            background: rgba(0, 204, 255, 0.1);
        }

        .format-option.active {
            border-color: var(--primary);
            background: rgba(0, 204, 255, 0.2);
            box-shadow: var(--glow);
        }

        .quality-slider {
            width: 100%;
            margin: 1.5rem 0;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .slider-label {
            min-width: 100px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: rgba(0, 204, 255, 0.2);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: var(--glow);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .file-info {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: rgba(224, 247, 255, 0.7);
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: rgba(224, 247, 255, 0.5);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .tool-container {
                padding: 1.5rem;
            }
            
            .upload-area {
                padding: 2rem 1rem;
            }
            
            .preview-container {
                flex-direction: column;
            }
            
            .preview-box {
                min-width: 100%;
            }
            
            .format-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Converter</h1>
            <p class="subtitle">Convert images to different formats with a futuristic touch</p>
        </header>
        
        <main>
            <div class="tool-container">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <h2 class="upload-text">Drag & Drop your image here</h2>
                    <p>or</p>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="btn" id="browseBtn">Browse Files</button>
                </div>
                
                <div class="preview-section" id="previewSection">
                    <div class="preview-container">
                        <div class="preview-box">
                            <h3 class="preview-title">Original Image</h3>
                            <img id="originalPreview" class="image-preview" alt="Original preview">
                            <div class="file-info" id="originalInfo"></div>
                        </div>
                        <div class="preview-box">
                            <h3 class="preview-title">Converted Image</h3>
                            <img id="convertedPreview" class="image-preview" alt="Converted preview">
                            <div class="file-info" id="convertedInfo"></div>
                        </div>
                    </div>
                    
                    <div class="format-options">
                        <div class="format-option active" data-format="jpeg">JPEG</div>
                        <div class="format-option" data-format="png">PNG</div>
                        <div class="format-option" data-format="webp">WebP</div>
                    </div>
                    
                    <div class="quality-control">
                        <div class="slider-container">
                            <span class="slider-label">Quality:</span>
                            <input type="range" id="qualitySlider" class="quality-slider" min="0.1" max="1" step="0.1" value="0.8">
                            <span id="qualityValue">80%</span>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn action-btn" id="convertBtn">Convert Image</button>
                        <button class="btn action-btn" id="downloadBtn" disabled>Download Converted</button>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Image Converter Tool &copy; 2023 | Part of Multi-Tool Website</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const browseBtn = document.getElementById('browseBtn');
            const previewSection = document.getElementById('previewSection');
            const originalPreview = document.getElementById('originalPreview');
            const convertedPreview = document.getElementById('convertedPreview');
            const originalInfo = document.getElementById('originalInfo');
            const convertedInfo = document.getElementById('convertedInfo');
            const formatOptions = document.querySelectorAll('.format-option');
            const qualitySlider = document.getElementById('qualitySlider');
            const qualityValue = document.getElementById('qualityValue');
            const convertBtn = document.getElementById('convertBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Variables
            let originalImage = null;
            let convertedImageBlob = null;
            let selectedFormat = 'jpeg';
            let quality = 0.8;
            
            // Event Listeners
            browseBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            qualitySlider.addEventListener('input', updateQuality);
            convertBtn.addEventListener('click', convertImage);
            downloadBtn.addEventListener('click', downloadImage);
            
            // Format selection
            formatOptions.forEach(option => {
                option.addEventListener('click', () => {
                    formatOptions.forEach(opt => opt.classList.remove('active'));
                    option.classList.add('active');
                    selectedFormat = option.getAttribute('data-format');
                });
            });
            
            // Functions
            function handleDragOver(e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            }
            
            function handleDragLeave(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            }
            
            function handleDrop(e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                if (e.dataTransfer.files.length) {
                    processFile(e.dataTransfer.files[0]);
                }
            }
            
            function handleFileSelect(e) {
                if (e.target.files.length) {
                    processFile(e.target.files[0]);
                }
            }
            
            function processFile(file) {
                if (!file.type.match('image.*')) {
                    alert('Please select an image file.');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        originalPreview.src = e.target.result;
                        originalInfo.textContent = `Size: ${formatFileSize(file.size)} | Dimensions: ${originalImage.width}×${originalImage.height}`;
                        previewSection.style.display = 'block';
                        downloadBtn.disabled = true;
                    };
                    originalImage.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            function updateQuality() {
                quality = parseFloat(qualitySlider.value);
                qualityValue.textContent = `${Math.round(quality * 100)}%`;
            }
            
            function convertImage() {
                if (!originalImage) return;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                
                ctx.drawImage(originalImage, 0, 0);
                
                let mimeType = 'image/jpeg';
                if (selectedFormat === 'png') mimeType = 'image/png';
                if (selectedFormat === 'webp') mimeType = 'image/webp';
                
                // For PNG, quality doesn't apply, so we set it to 1
                const exportQuality = selectedFormat === 'png' ? 1 : quality;
                
                canvas.toBlob(function(blob) {
                    convertedImageBlob = blob;
                    const url = URL.createObjectURL(blob);
                    convertedPreview.src = url;
                    convertedInfo.textContent = `Format: ${selectedFormat.toUpperCase()} | Size: ${formatFileSize(blob.size)}`;
                    downloadBtn.disabled = false;
                }, mimeType, exportQuality);
            }
            
            function downloadImage() {
                if (!convertedImageBlob) return;
                
                const a = document.createElement('a');
                a.href = URL.createObjectURL(convertedImageBlob);
                a.download = `converted-image.${selectedFormat}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' bytes';
                else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
                else return (bytes / 1048576).toFixed(2) + ' MB';
            }
        });
    </script>
</body>
</html>
